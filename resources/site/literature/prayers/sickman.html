
<div align="center">
    <p>God, when a person offends me, help me to remember this is a sick person. Help me show the same tolerance, pity, and patience that we would cheerfully grant a sick friend. Show me how can I help them. Save me from being angry. Thy will be done.</p>
    <br/><strong>Alcoholics Anonymous p. 67</strong>
</div>
