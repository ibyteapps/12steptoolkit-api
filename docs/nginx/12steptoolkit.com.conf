# ─────────────────────────────────────────────────────────────────────────────
# 12steptoolkit.com — the Laravel application, grafted onto three prefixes
#
# Paste this into Plesk → Websites & Domains → 12steptoolkit.com →
# Apache & nginx Settings → "Additional nginx directives", UNDER the gzip
# settings and the three /app/* blocks already there. Plesk runs `nginx -t`
# before it saves, so a typo is refused rather than applied.
#
# ## What it does to the website: nothing
#
# The document root stays `WEBSITES/12steptoolkit.com/out`. Every page of the
# Next.js export — all 205 indexed URLs, `sitemap.xml`, `robots.txt`,
# `app-ads.txt`, `reflections.php`, `/app/reset/*` — goes on being served by
# nginx → Apache exactly as before, by the same rules, from the same files.
#
# The three prefixes below are **404s on this domain today**. That is the
# whole safety argument: if any of this is wrong they stay 404s, and nothing
# the website serves passes through here at all.
#
# ## Two details that are the difference between working and not
#
# **`^~`.** A prefix location marked `^~` beats the regex
# `location ~ \.php(/.*)?$` higher up the generated config. Without it a
# request for `/console/login` would be examined by that PHP block, resolved
# against the export's document root, and 404'd.
#
# **`SCRIPT_FILENAME`.** Plesk's `/etc/nginx/fastcgi.conf` derives it from
# `$document_root` and the request path, which for `/console/login` names a
# file that does not exist. Laravel has one entry point, so it is set
# absolutely, after the include — PHP reads the parameters in order and the
# last one wins.
#
# The socket is the one this domain's PHP-FPM pool already listens on, the
# same as the existing `location ~ \.php` block. No second pool, no second PHP
# version, nothing to keep in step.
#
# ## The cost, stated plainly
#
# Any NEW top-level path this application should answer needs a block here —
# this file is the list, and it lives in Plesk's UI rather than in the deploy.
# `/api/v1` and the legacy `/<prefix>/19` paths are deliberately absent: the
# shipped apps call `scripts.12steptoolkit.com` and `apple.12stepapp.com`, and
# moving those is `docs/CUTOVER.md` steps 4 and 5, not this.
# ─────────────────────────────────────────────────────────────────────────────

location ^~ /console {
    root /var/www/vhosts/ibyteserver.com/WEBSITES/12steptoolkit.com/api/public;
    try_files $uri @laravel;
}

location ^~ /api/v2 {
    root /var/www/vhosts/ibyteserver.com/WEBSITES/12steptoolkit.com/api/public;
    try_files $uri @laravel;
}

# Laravel's health endpoint, so the deploy's smoke test has a page of its own
# to ask about rather than judging one the export serves.
location = /up {
    root /var/www/vhosts/ibyteserver.com/WEBSITES/12steptoolkit.com/api/public;
    try_files $uri @laravel;
}

location @laravel {
    include /etc/nginx/fastcgi.conf;

    fastcgi_pass unix:/var/www/vhosts/system/12steptoolkit.com/php-fpm.sock;

    fastcgi_param SCRIPT_FILENAME /var/www/vhosts/ibyteserver.com/WEBSITES/12steptoolkit.com/api/public/index.php;
    fastcgi_param SCRIPT_NAME     /index.php;
    fastcgi_param DOCUMENT_ROOT   /var/www/vhosts/ibyteserver.com/WEBSITES/12steptoolkit.com/api/public;

    # Empty, or Laravel reads a path inside index.php as a route.
    fastcgi_param PATH_INFO       "";

    fastcgi_read_timeout 120;
}
